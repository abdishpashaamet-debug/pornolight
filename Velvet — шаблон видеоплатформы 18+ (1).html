<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet — видеоплатформа 18+</title>
<style>
:root{--bg:#000;--panel:#141414;--line:#2a2a2a;--text:#f2f2f2;--muted:#9a9a9a;--accent:#ff9000;--accent-ink:#000;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b0b0b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.4}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px}
.logo b{background:var(--accent);color:var(--accent-ink);padding:0 7px;border-radius:4px;margin-left:3px}
.search{flex:1;min-width:200px;display:flex}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:6px 0 0 6px;font-size:15px}
.search button{background:var(--accent);color:var(--accent-ink);border:0;padding:0 18px;font-weight:700;border-radius:0 6px 6px 0;cursor:pointer}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:9px 16px;border-radius:6px;font-weight:700;cursor:pointer}
nav{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:14px}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
nav button:focus-visible,.btn:focus-visible,.card:focus-visible,.search button:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{padding:20px;max-width:1400px;margin:0 auto}
h2{font-size:20px;margin:0 0 14px;border-left:4px solid var(--accent);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer;font:inherit}
.thumb{aspect-ratio:16/9;border-radius:6px;position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.6))}
.dur,.hd{position:absolute;bottom:6px;z-index:1;font-size:12px;font-weight:700;background:rgba(0,0,0,.75);padding:1px 6px;border-radius:3px}
.dur{right:6px}.hd{left:6px;color:var(--accent)}
.card h3{font-size:15px;margin:8px 0 2px;font-weight:600}
.card:hover h3{color:var(--accent)}
.meta{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);padding:24px 20px;color:var(--muted);font-size:13px;text-align:center}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0;width:min(860px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.85)}
.player{aspect-ratio:16/9;display:grid;place-items:center;color:#fff;font-size:15px;text-align:center;padding:20px}
.dlg-body{padding:16px 20px}
.gate{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;padding:20px}
.gate div{max-width:440px;text-align:center}
.gate h1{font-size:30px;margin:0 0 10px}
.gate p{color:var(--muted)}
.gate .row{display:flex;gap:10px;justify-content:center;margin-top:20px}
.gate .yes{background:var(--accent);color:var(--accent-ink);border:0;padding:12px 24px;border-radius:6px;font-weight:800;cursor:pointer;font-size:16px}
.hidden{display:none}
</style>
</head>
<body>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
  <div>
    <div class="logo" style="margin-bottom:20px">Velvet<b>18+</b></div>
    <h1 id="gt">Только для взрослых</h1>
    <p>Сайт содержит материалы для лиц старше 18 лет. Подтвердите возраст, чтобы продолжить.</p>
    <div class="row">
      <button class="yes" id="yes">Мне есть 18 лет</button>
      <a class="btn" href="about:blank" style="text-decoration:none">Выйти</a>
    </div>
  </div>
</div>

<header>
  <div class="logo">Velvet<b>Tube</b></div>
  <form class="search" id="sf" role="search">
    <input id="q" type="search" placeholder="Поиск видео" aria-label="Поиск видео">
    <button type="submit">Найти</button>
  </form>
  <button class="btn" type="button">Войти</button>
  <button class="btn" type="button" style="background:var(--accent);color:var(--accent-ink)">Регистрация</button>
</header>
<nav id="tabs" aria-label="Категории"></nav>

<main>
  <h2 id="title">Новое</h2>
  <div class="grid" id="grid"></div>
  <p class="empty hidden" id="empty">Ничего не найдено. Измените запрос или выберите другую категорию.</p>
</main>

<footer>Шаблон интерфейса. Контент — заглушки. © Velvet · 18+</footer>

<dialog id="dlg">
  <div class="player" id="pl">Здесь будет видеоплеер</div>
  <div class="dlg-body">
    <h3 id="dt" style="margin:0 0 4px"></h3>
    <div class="meta" id="dm"></div>
    <div style="margin-top:14px"><button class="btn" id="close" type="button">Закрыть</button></div>
  </div>
</dialog>

<script>
var CATS=["Новое","Популярное","Топ недели","HD","Длинные","Подборки"];
var VIDEOS=[];
(function(){
  var names=["Закат над городом","Ночная съёмка","Первый эфир","Студийная сессия","Live-запись","Лучшее за месяц","Новый формат","Эксклюзив","Backstage","Дубль второй","Полная версия","Короткий клип"];
  for(var i=0;i<24;i++){
    var h=(i*47)%360;
    VIDEOS.push({
      id:i,title:names[i%names.length]+(i>=names.length?" "+(Math.floor(i/names.length)+1):""),
      cat:CATS[i%CATS.length],
      views:Math.round(((i*7919)%900)+40)+" тыс.",
      dur:(5+(i*3)%35)+":"+("0"+((i*17)%60)).slice(-2),
      hd:i%3===0,
      bg:"linear-gradient(135deg,hsl("+h+",55%,28%),hsl("+((h+60)%360)+",60%,12%))"
    });
  }
})();
var state={cat:"Новое",q:""};
var tabs=document.getElementById("tabs"),grid=document.getElementById("grid"),empty=document.getElementById("empty");
function renderTabs(){
  tabs.innerHTML="";
  CATS.forEach(function(c){
    var b=document.createElement("button");
    b.textContent=c;b.setAttribute("aria-pressed",String(c===state.cat));
    b.onclick=function(){state.cat=c;render()};
    tabs.appendChild(b);
  });
}
function render(){
  renderTabs();
  document.getElementById("title").textContent=state.q?"Результаты: "+state.q:state.cat;
  var q=state.q.toLowerCase();
  var list=VIDEOS.filter(function(v){return q?v.title.toLowerCase().indexOf(q)>-1:(state.cat==="Новое"||v.cat===state.cat)});
  grid.innerHTML="";
  list.forEach(function(v){
    var c=document.createElement("button");c.className="card";c.type="button";
    c.innerHTML='<div class="thumb" style="background:'+v.bg+'">'+(v.hd?'<span class="hd">HD</span>':'')+'<span class="dur">'+v.dur+'</span></div><h3></h3><div class="meta">'+v.views+' просмотров</div>';
    c.querySelector("h3").textContent=v.title;
    c.onclick=function(){open(v)};
    grid.appendChild(c);
  });
  empty.classList.toggle("hidden",list.length>0);
}
var dlg=document.getElementById("dlg");
function open(v){
  document.getElementById("pl").style.background=v.bg;
  document.getElementById("dt").textContent=v.title;
  document.getElementById("dm").textContent=v.views+" просмотров · "+v.dur+" · "+v.cat;
  dlg.showModal();
}
document.getElementById("close").onclick=function(){dlg.close()};
document.getElementById("sf").onsubmit=function(e){e.preventDefault();state.q=document.getElementById("q").value.trim();render()};
var gate=document.getElementById("gate");
try{if(sessionStorage.getItem("age18")==="1")gate.classList.add("hidden")}catch(e){}
document.getElementById("yes").onclick=function(){gate.classList.add("hidden");try{sessionStorage.setItem("age18","1")}catch(e){}};
render();
</script>
</body>
</html>
