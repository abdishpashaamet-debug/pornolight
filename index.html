<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet — видеоплатформа 18+</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
  <div>
    <div class="logo" style="margin-bottom:20px">Velvet<b>18+</b></div>
    <h1 id="gt">Только для взрослых</h1>
    <p>Сайт содержит материалы для лиц старше 18 лет. Подтвердите возраст, чтобы продолжить.</p>
    <div class="row">
      <button class="yes" id="yes">Мне есть 18 лет</button>
      <a class="btn" href="about:blank" style="text-decoration:none">Выйти</a>
    </div>
  </div>
</div>

<header>
  <div class="logo">Velvet<b>Tube</b></div>
  <form class="search" id="sf" role="search">
    <input id="q" type="search" placeholder="Поиск видео" aria-label="Поиск видео">
    <button type="submit">Найти</button>
  </form>
  <button class="btn" type="button">Войти</button>
  <button class="btn" type="button" style="background:var(--accent);color:var(--accent-ink)">Регистрация</button>
</header>
<nav id="tabs" aria-label="Категории"></nav>

<main>
  <h2 id="title">Новое</h2>
  <div class="grid" id="grid"></div>
  <p class="empty hidden" id="empty">Ничего не найдено. Измените запрос или выберите другую категорию.</p>
</main>

<footer>Шаблон интерфейса. Контент — заглушки. © Velvet · 18+</footer>

<dialog id="dlg">
  <div class="player" id="pl">Здесь будет видеоплеер</div>
  <div class="dlg-body">
    <h3 id="dt" style="margin:0 0 4px"></h3>
    <div class="meta" id="dm"></div>
    <div style="margin-top:14px"><button class="btn" id="close" type="button">Закрыть</button></div>
  </div>
</dialog>

<script src="assets/js/app.js" defer></script>
</body>
</html>
